<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>iSign İmza</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 16px; color: #1a1a1a; }
    button { background: #2b6cb0; color: #fff; border: none; border-radius: 4px; padding: 10px 16px; font-size: 14px; cursor: pointer; width: 100%; }
    button:disabled { background: #a0aec0; cursor: default; }
    #status { margin-top: 12px; font-size: 13px; color: #4a5568; white-space: pre-wrap; }
    #pinReminder {
      position: relative;
      margin-top: 22px;
      padding: 14px 14px 12px;
      border-radius: 8px;
      background: #eef5fb;
      border: 2px dashed #005dab;
      text-align: center;
    }
    #pinReminder h2 { margin: 2px 0 6px; font-size: 13px; font-weight: 600; color: #00447a; }
    #pinReminder p { margin: 0; font-size: 12px; line-height: 1.5; color: #3c4256; }
    #pinReminder .note { margin-top: 8px; font-size: 11px; color: #5f6780; }
    .arrow-pointer {
      position: absolute;
      top: -20px;
      right: 14px;
      font-size: 20px;
      line-height: 1;
      color: #005dab;
      animation: bounce 1s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow-pointer { animation: none; }
    }
  </style>
</head>
<body>
  <p>Kurumsal imzanızı, imlecin bulunduğu konuma ekler.</p>
  <button id="insertBtn">İmzamı Ekle</button>
  <div id="status"></div>
  <div id="pinReminder">
    <span class="arrow-pointer" aria-hidden="true">▲</span>
    <h2>Otomatik imzayı etkinleştirin</h2>
    <p>
      İmzanızın her yeni e-postada otomatik gelmesi için panelin üst kısmındaki
      <strong>Raptiye (Pin)</strong> simgesine bir kez tıklayın.
    </p>
    <div class="note">Tek seferlik bir işlemdir — sabitlemeyi kaldırırsanız bu butona tekrar manuel basmanız gerekir.</div>
  </div>
  <script src="taskpane.js"></script>
</body>
</html>
